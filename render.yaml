# Initial production blueprint for CAREST 360.
# The review build runs as one stateless web service; the production split can
# move Next.js and NestJS into separate services without changing the domain API.
services:
  - type: web
    name: carest-360-production
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: INSTITUTION_NAME
        value: CAREST College of Health
      - key: INSTITUTION_TIMEZONE
        value: Africa/Accra
      - key: INSTITUTION_CURRENCY
        value: GHS
      - key: DATABASE_URL
        fromDatabase:
          name: carest-360-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: carest-360-postgres
    plan: free
    region: frankfurt
    databaseName: carest
    user: carest
    postgresMajorVersion: "16"
